[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maxun"
version = "0.0.13"
description = "Python SDK for Maxun - web automation and data extraction"
requires-python = ">=3.8"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["httpx>=0.24.0", "python-dotenv>=1.0.0"]
authors = [
    { name = "Maxun", email = "support@maxun.dev" }
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]
all = ["anthropic>=0.18.0", "openai>=1.0.0"]
test = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/getmaxun/python-sdk"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
